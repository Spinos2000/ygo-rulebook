<!doctype html>
<meta charset="utf-8">
<title>演出DEMO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* 演出だけを確かめるページ（遊ぶ人の画面からは入れない。リンクを知っている人だけ）。盤面は本物のデュエル卓を静かに開いて使う */
:root {
  --d-bg: #f5f2eb; --d-panel: #fffdf8; --d-panel-2: #f3eee4; --d-ink: #262b3a; --d-sub: #6a6e7e; --d-line: #e2dbcd; --d-edge: #2c3244;
  --d-mat: #1d4737; --d-mat-2: #163a2c; --d-mat-line: #5c8c78; --d-mat-ink: #d6ece1;
  --d-accent: #f1c95b; --d-accent-ink: #262b3a; --d-opp: #d75a5f; --d-me: #3e6fd0; --d-bad: #b23a3a;
  --d-shadow: 0 10px 30px rgba(10, 30, 20, .18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;
  --d-mat: #173d2f; --d-mat-2: #102c21; --d-mat-line: #3f6e5c; --d-mat-ink: #cfe6da; --d-accent: #f0d27a; --d-opp: #e07479; --d-me: #6b97dd; --d-bad: #e07070;
  --d-shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;
  --d-mat: #173d2f; --d-mat-2: #102c21; --d-mat-line: #3f6e5c; --d-mat-ink: #cfe6da; --d-accent: #f0d27a; --d-opp: #e07479; --d-me: #6b97dd; --d-bad: #e07070;
  --d-shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
body { margin: 0; background: var(--d-bg); color: var(--d-ink); font-family: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif }
/* 演出を選ぶ欄：右下の丸いボタンで開く。開いている間は盤面の上に出て、押すと閉じてすぐ演出が始まる */
#demoOpen { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; border: 2px solid var(--d-edge); border-radius: 999px;
  background: var(--d-accent); color: var(--d-accent-ink); font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; padding: 14px 18px; box-shadow: var(--d-shadow); cursor: pointer }
#demo { position: fixed; inset: auto 0 0 0; z-index: 61; max-height: 78vh; overflow-y: auto; background: var(--d-panel); color: var(--d-ink);
  border-top: 2px solid var(--d-edge); border-radius: 18px 18px 0 0; box-shadow: var(--d-shadow); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)) }
#demo[hidden] { display: none }
#demo header { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -12px; background: var(--d-panel); padding: 4px 0 8px }
#demo h1 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0 }
#demo .close { border: 1px solid var(--d-line); background: var(--d-panel-2); color: var(--d-ink); border-radius: 10px; font-family: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer }
#demo .note { font-size: 12px; color: var(--d-sub); margin: 0 0 6px }
#demo h2 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 14px; line-height: 1.4; margin: 14px 0 6px }
#demo h2 small { font-weight: 500; color: var(--d-sub) }
#demo .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
#demo button.fx { min-height: 48px; text-align: left; border: 1px solid var(--d-line); border-radius: 12px; background: var(--d-panel-2); color: var(--d-ink);
  font-family: inherit; font-weight: 700; font-size: 13px; line-height: 1.35; padding: 8px 10px; cursor: pointer }
#demo button.fx small { display: block; font-weight: 500; font-size: 11px; color: var(--d-sub) }
#demo button.fx:active { transform: translateY(1px) }
#demo label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 6px }
#demo .guide-open { width: 100%; margin-top: 10px }
/* ---------- t30：相手の発動の確認画面（DEMOだけ。本物の卓にはまだ入れない） ---------- */
#demo .ack-set { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 6px }
#demo .ack-set label { margin-top: 0 }
#ackLayer { position: fixed; inset: 0; z-index: 58; background: rgba(8, 14, 28, .38) }
#ackLayer[hidden], #ackToast[hidden] { display: none }
#ackArrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
#ackArrows .ring { fill: none; stroke: var(--d-accent); stroke-width: 3; rx: 8; animation: ackPulse 1s ease-in-out infinite alternate }
#ackArrows .line { fill: none; stroke: var(--d-accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 7; animation: ackDash .8s linear infinite }
#ackArrows .head { fill: var(--d-accent) }
@keyframes ackPulse { from { opacity: .55 } to { opacity: 1 } }
@keyframes ackDash { to { stroke-dashoffset: -17 } }
#ackPanel { position: absolute; left: 12px; right: 12px; max-width: 560px; margin: 0 auto; max-height: calc(100% - 24px); overflow-y: auto; background: var(--d-panel); color: var(--d-ink);
  border: 2.5px solid var(--d-edge); border-radius: 16px; box-shadow: 5px 6px 0 var(--d-edge); padding: 12px 14px 14px; box-sizing: border-box }
#ackPanel.at-top { top: calc(12px + env(safe-area-inset-top, 0px)) }
#ackPanel.at-bottom { bottom: calc(12px + env(safe-area-inset-bottom, 0px)) }
#ackPanel .who { display: flex; align-items: center; gap: 8px; font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 14px; margin: 0 0 8px }
#ackPanel .who .tag { background: var(--d-opp); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 13px }
#ackPanel .who .tag.me { background: var(--d-me) }
#ackPanel .who .chain { border: 1.5px solid var(--d-edge); border-radius: 999px; padding: 2px 10px; background: var(--d-accent); color: var(--d-accent-ink); font-family: Fredoka, inherit; font-size: 13px }
#ackPanel .body { display: flex; gap: 12px; align-items: flex-start }
#ackPanel .art { flex: none; width: 100px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0, 0, 0, .25) }
#ackPanel .txt { min-width: 0; flex: 1 }
#ackPanel h3 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 2px }
#ackPanel .kind { font-size: 12px; color: var(--d-sub); margin: 0 0 6px }
#ackPanel .eff { font-size: 13.5px; line-height: 1.55; margin: 0; padding: 8px 10px; background: var(--d-panel-2); border: 1px solid var(--d-line); border-radius: 10px; max-height: 9.6em; overflow-y: auto; white-space: pre-wrap }
#ackPanel .tgt { font-size: 13px; font-weight: 700; margin: 8px 0 0 }
#ackPanel .tgt::before { content: "🎯 " }
/* CODE 22:10（MASTERの決定）：［了承］はなし。［チェーンする］以外のどこをタップしても了承。［チェーンする］は大きめで、右上に離して置く */
#ackPanel .chainBtn { margin-left: auto; min-width: 128px; min-height: 56px; border-radius: 12px; font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; padding: 6px 12px; border: 2px solid var(--d-me); background: var(--d-panel); color: var(--d-me); box-shadow: 3px 3px 0 var(--d-me) }
#ackPanel .chainBtn small { display: block; font-family: "M PLUS Rounded 1c", inherit; font-weight: 500; font-size: 11px }
#ackPanel .chainBtn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--d-me) }
#ackLayer { cursor: pointer }
#ackPanel .who .tag, #ackPanel .who .chain, #ackPanel .chainBtn small { white-space: nowrap }
#ackPanel .chainBtn:disabled { border-color: var(--d-line); background: var(--d-panel-2); color: var(--d-sub); box-shadow: none; opacity: .75; cursor: not-allowed }
#ackPanel .hint { font-size: 12px; color: var(--d-sub); margin: 10px 0 0; text-align: center; opacity: .35; transition: opacity .2s }
#ackPanel.ready .hint { opacity: 1 }
#ackPanel ol.res { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px }
#ackPanel ol.res li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--d-line); border-radius: 10px; padding: 8px 10px; font-size: 14px; background: var(--d-panel-2); transition: background .2s, border-color .2s }
#ackPanel ol.res li b { font-family: Fredoka, inherit; min-width: 1.6em }
#ackPanel ol.res li.now { border: 2px solid var(--d-edge); background: var(--d-accent); color: var(--d-accent-ink) }
#ackPanel ol.res li.done { opacity: .55 }
/* 止めない時：上に小さく出して、すぐ消える */
#ackToast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 58; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--d-panel); color: var(--d-ink); border: 2px solid var(--d-edge); border-radius: 12px; box-shadow: 3px 4px 0 var(--d-edge); padding: 8px 14px; font-weight: 700; font-size: 14px }
/* 了承のあと、ログの行が光る（DEMOの見本のログ） */
#ackLog { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 57; width: min(340px, calc(100% - 120px)); list-style: none; margin: 0; padding: 6px 8px;
  background: var(--d-panel); color: var(--d-ink); border: 1.5px solid var(--d-edge); border-radius: 12px; font-size: 12px; box-shadow: var(--d-shadow) }
#ackLog[hidden] { display: none }
#ackLog li { padding: 3px 4px; border-radius: 6px }
#ackLog li.lit { animation: ackLit 2.4s ease-out }
@keyframes ackLit { 0%, 35% { background: var(--d-accent); color: var(--d-accent-ink) } 100% { background: transparent } }
/* 横向き（スマホの横・パソコン）：確認の箱は、対象と反対の横に寄せる */
@media (orientation: landscape) and (min-width: 640px) {
  #ackPanel { left: auto; right: auto; width: min(440px, 46vw); margin: 0; top: 50%; bottom: auto; transform: translateY(-50%) }
  #ackPanel.at-left { left: calc(12px + env(safe-area-inset-left, 0px)) }
  #ackPanel.at-right { right: calc(12px + env(safe-area-inset-right, 0px)) }
}
@media (orientation: landscape) and (min-width: 640px) and (max-height: 500px) {
  #ackPanel { padding: 8px 12px 10px } #ackPanel .art { width: 84px } #ackPanel h3 { font-size: 16px } #ackPanel .eff { font-size: 13px; max-height: 6.6em } #ackPanel .chainBtn { min-height: 46px }
}
</style>
<div id="duel-host"></div>
<button id="demoOpen" type="button">🎬 演出を選ぶ</button>
<section id="demo" aria-label="演出を選ぶ">
  <header><h1>🎬 演出DEMO</h1><button class="close" type="button" id="demoClose">閉じる</button></header>
  <p class="note">ボタンを押すと、すぐその演出が出ます。対戦は進めなくて大丈夫です。</p>
  <label><input type="checkbox" id="demoSlow"> ゆっくり再生（半分の速さ）</label>
  <button type="button" class="fx guide-open" id="guideOpenDemo">📖 操作ガイドを開く<small>はじめて卓を開いた時に出る案内（何度でも開けます）</small></button>
  <div id="demoList"></div>
</section>
<div id="ackLayer" hidden><svg id="ackArrows" aria-hidden="true"></svg><div id="ackPanel" role="dialog" aria-modal="true" aria-labelledby="ackName"></div></div>
<div id="ackToast" role="status" hidden></div>
<ol id="ackLog" aria-label="ログ（見本）" hidden></ol>
<script type="module">
import { mountDuel } from './embed.js?v=20261122-2220-72a1e26965';
import { playSummon, cardImg } from './fx.js?v=20261122-2220-72a1e26965';
import { play, unlock } from './sound.js?v=20261122-2220-72a1e26965';
import { CARD_POOL } from './data/cardpool.js?v=20261122-2220-72a1e26965';
import { createGame, legalActions } from './engine/game.js?v=20261122-2220-72a1e26965';
import { answerCandidates } from './ai/cpu.js?v=20261122-2220-72a1e26965';

const host = document.getElementById('duel-host');
mountDuel(host, { demo: true });
const root = host.shadowRoot;

/* カード：本物のカードのデータ（名前で探す）。ラーの翼神竜は今のデッキに入っていないので、見た目用の仮のデータ */
const byName = Object.fromEntries(Object.values(CARD_POOL).map(d => [d.name, d]));
const RA = { name: 'ラーの翼神竜', kind: 'monster', frame: 'effect', level: 10, attribute: '神', race: '幻神獣族', atk: 0, def: 0, text: '' };
const card = n => (n === RA.name ? RA : byName[n]);

/* 並べる演出：[見出し, [ボタンの名前, カード名, 分類, 形]] 形＝ me（自分）／cpu（CPU側）／short（2回目）／allies（仲間あり）／alone（仲間なし）／how:◯◯（ふつうの召喚） */
const LIST = [
  ['👑 神・レベル10以上', '★5・約4秒', [
    ['オシリスの天空竜', 'オシリスの天空竜', 'god', 'me', '赤'], ['オベリスクの巨神兵', 'オベリスクの巨神兵', 'god', 'me', '青'], ['ラーの翼神竜', RA.name, 'god', 'me', '金'],
    ['邪神アバター', '邪神アバター', 'god', 'me', '闇・Lv10'], ['F・G・D', 'F・G・D', 'god', 'me', '闇・Lv12'], ['ユベル－Das Extremer Traurig Drachen', 'ユベル－Das Extremer Traurig Drachen', 'god', 'me', '闇・Lv12']]],
  ['🌟 ロマンエース', '★4・約3秒', [
    ['マジシャン・オブ・ブラックカオス', 'マジシャン・オブ・ブラックカオス', 'roman', 'me', '闇'], ['青眼の究極竜', '青眼の究極竜', 'roman', 'me', '光'], ['究極恐獣', '究極恐獣', 'roman', 'me', '地']]],
  ['🏆 トップエース', '★4・約3秒', [
    ['ブラック・マジシャン', 'ブラック・マジシャン', 'top', 'me', '闇'], ['青眼の白龍', '青眼の白龍', 'top', 'me', '光'], ['神獣王バルバロス', '神獣王バルバロス', 'top', 'me', '地']]],
  ['⭐ エース', '★3・約2秒', [
    ['人造人間－サイコ・ショッカー', '人造人間－サイコ・ショッカー', 'ace', 'me', '闇'], ['ユベル', 'ユベル', 'ace', 'me', '闇'], ['XYZ－ドラゴン・キャノン', 'XYZ－ドラゴン・キャノン', 'ace', 'me', '光'], ['バスター・ブレイダー', 'バスター・ブレイダー', 'ace', 'me', '地']]],
  ['🤝 相棒（特別枠）', 'ふつうの召喚＋相棒の音・ひと言', [
    ['サイレント・マジシャン LV４', 'サイレント・マジシャン LV４', 'partner', 'me', '光'], ['黄泉ガエル', '黄泉ガエル', 'partner', 'me', '水'],
    ['サイバー・ダーク・エッジ', 'サイバー・ダーク・エッジ', 'partner', 'cpu', 'CPU側']]],
  ['🤖 CPU側で出た時', '', [
    ['人造人間－サイコ・ショッカー', '人造人間－サイコ・ショッカー', 'ace', 'cpu', 'エース・CPU'], ['青眼の白龍', '青眼の白龍', 'top', 'cpu', 'トップエース・CPU']]],
  ['🔁 2回目から（短い演出）', '約0.8秒', [
    ['ブラック・マジシャン', 'ブラック・マジシャン', 'top', 'short', '2回目'], ['サイレント・マジシャン LV４', 'サイレント・マジシャン LV４', 'partner', 'short', '2回目']]],
  ['🃏 ふつうの召喚（切り札でない）', '', [
    ['通常召喚', 'クィーンズ・ナイト', '', 'how:normal', 'クィーンズ・ナイト'], ['特殊召喚', 'クィーンズ・ナイト', '', 'how:special', 'クィーンズ・ナイト'],
    ['セット', 'クィーンズ・ナイト', '', 'how:set', '裏側'], ['反転召喚', 'クィーンズ・ナイト', '', 'how:flip', 'クィーンズ・ナイト']]],
];

const list = document.getElementById('demoList');
list.innerHTML = LIST.map(([h, sub, items], gi) => `<h2>${h} <small>${sub}</small></h2><div class="row">${items.map((it, i) => card(it[1]) ? `<button class="fx" type="button" data-g="${gi}" data-i="${i}">${it[0]}<small>${it[4]}</small></button>` : '').join('')}</div>`).join('');

const sheet = document.getElementById('demo'), openBtn = document.getElementById('demoOpen');
const setOpen = on => { sheet.hidden = !on; openBtn.hidden = on; };
document.getElementById('demoClose').onclick = () => setOpen(false);
openBtn.onclick = () => setOpen(true);

/* 相棒の「仲間あり」：自分のデッキのモンスター2枚を、場の左右のマスに表側で並べる（見た目だけ。DEMOの盤面の中だけの話） */
let alliesOn = [];
function setAllies(on) {
  const D = window.__duel, S = D && D.state; if (!S) return;
  const P = S.players[0];
  if (on && !alliesOn.length) {
    const mons = P.deck.map(u => S.cards[u]).filter(c => CARD_POOL[c.code]?.kind === 'monster').slice(0, 2);
    mons.forEach((c, k) => { const i = k ? 4 : 0; P.deck = P.deck.filter(u => u !== c.uid); P.mzone[i] = c.uid; Object.assign(c, { zone: 'mzone', index: i, faceUp: true, position: 'atk', controller: 0 }); alliesOn.push([c.uid, i]); });
  } else if (!on && alliesOn.length) {
    alliesOn.forEach(([u, i]) => { const c = S.cards[u]; P.mzone[i] = null; P.deck.push(u); Object.assign(c, { zone: 'deck', index: 0, faceUp: false }); });
    alliesOn = [];
  } else return;
  D.load(S);
}
/* 帯を置いてよい範囲（本物の卓と同じ決め方：上の帯の下から、手札・ボタンの上まで） */
function safeArea() {
  const vh = innerHeight; let top = 0, bottom = vh;
  const tb = root.querySelector('.top'); if (tb) top = Math.max(top, tb.getBoundingClientRect().bottom);
  for (const q of ['#dock', '#tray', '#chain']) { const e = root.querySelector(q); if (!e || e.hidden) continue; const r = e.getBoundingClientRect(); if (r.height && r.top > vh * .35 && r.top < vh) bottom = Math.min(bottom, r.top); }
  return { top, bottom };
}
/* 盤面のマス（自分の真ん中・CPUの真ん中）と、仲間の位置 */
const zoneRect = key => root.querySelector(`#board [data-zone="${key}"]`)?.getBoundingClientRect();
let busy = false;
list.addEventListener('click', async e => {
  const b = e.target.closest('button.fx'); if (!b || busy) return;
  const [, , cls, kind] = LIST[b.dataset.g][2][b.dataset.i], d = card(LIST[b.dataset.g][2][b.dataset.i][1]);
  unlock(); setOpen(false); busy = true; openBtn.hidden = true;
  const droot = root.querySelector('.droot'); droot.classList.add('fx-busy', 'fx-stage'); // 本物の卓と同じく、演出の間はどこも押せない
  setAllies(kind === 'allies');
  await new Promise(r => setTimeout(r, 250)); // 欄が閉じて、盤面が描き直されてから
  const cpu = kind === 'cpu', rect = zoneRect(cpu ? '1:mz:2' : '0:mz:2');
  const how = kind.startsWith('how:') ? kind.slice(4) : 'normal';
  const allies = kind === 'allies' ? [zoneRect('0:mz:0'), zoneRect('0:mz:4')].filter(Boolean) : [];
  const ace = cls ? { cls, big: kind !== 'short', fallback: false, side: cpu ? 'CPU' : 'あなた' } : null;
  const slow = document.getElementById('demoSlow').checked;
  try {
    await playSummon(root, { rect, d, atk: d.atk, def: d.def, pos: 'atk', how, faceDown: how === 'set', mats: [], allies, ace, safe: safeArea(),
      // 相棒：2回目からも相棒の音（MASTERの決定：見た目はふつう、音とひと言で特別に。ひと言は初めての時だけ）
      onLand: () => { if (cls === 'partner') play(['aceBond']); else if (ace && ace.big) play([cls === 'god' ? 'aceGod' : 'aceLand']); else play([how === 'set' ? 'set' : how === 'special' ? 'special' : 'summon']); },
      mat: root.querySelector('.mat-skin'), speed: slow ? .5 : 1 });
  } catch (err) { console.error(err); }
  droot.classList.remove('fx-busy', 'fx-stage'); busy = false; setOpen(true);
});
/* ---------- 順番の確かめ（No.7）：場面を作って、本物の対戦と同じ流れで発動まで進める ----------

  const d = CARD_POOL[link.code];
  ackPanel.innerHTML = `<p class="who"><span class="tag${link.p ? '' : ' me'}">${WHO_T(link.p)}が発動</span><span class="chain">チェーン${link.no}</span><button type="button" class="chainBtn"${canChain ? '' : ' disabled'}>チェーンする<small>${canChain ? '自分のカードを重ねる' : '今できるカードなし'}</small></button></p>
<div class="body"><span class="artBox"></span><div class="txt"><h3 id="ackName">${esc(d.name)}</h3><p class="kind">${esc(KIND(d))}</p><p class="eff">${esc(d.text || '')}</p>${link.tgt ? `<p class="tgt">${esc(link.tgt)}</p>` : ''}</div></div>
<p class="hint">👆 タップで進む（［チェーンする］以外のどこでも・Enter キーでも）</p>`;
  const art = cardImg(d, d.atk, d.def, true); art.className = 'art'; art.setAttribute('role', 'img'); art.setAttribute('aria-label', d.name);
  ackPanel.querySelector('.artBox').replaceWith(art);
  ackPanel.classList.remove('ready'); ackLayer.hidden = false; ackNow = link; ackPlace(link);
  return new Promise(res => {
    const done = v => { removeEventListener('keydown', key); ackLayer.onclick = null; ackLayer.hidden = true; ackNow = null; res(v); };
    const key = e => { if (e.key === 'Enter' && ready()) { e.preventDefault(); done('ok'); } };
    addEventListener('keydown', key);
    // 出てから0.6秒は、タップを受け付けない（続けてタップしていた指で、読まずに進まないように）
    const t0 = performance.now(), ready = () => performance.now() - t0 >= 600;
    setTimeout(() => ackPanel.classList.add('ready'), 600);
    ackLayer.onclick = e => { if (e.target.closest('.chainBtn') || !ready()) return; done('ok'); };
    ackPanel.querySelector('.chainBtn').onclick = e => { e.stopPropagation(); if (canChain && ready()) done('chain'); };
  });
}
async function ackToastShow(text) { ackToast.textContent = text; ackToast.hidden = false; await sleep(1800); ackToast.hidden = true; }
/** チェーンの処理を、逆の順（3→2→1）に1つずつ見せる */
async function ackResolve(links) {
  ackPanel.className = wideMQ.matches ? 'at-right' : 'at-top'; ackSvg.innerHTML = '';
  ackPanel.innerHTML = `<p class="who"><span class="chain" style="margin-left:0">チェーンの処理</span>あとから発動したほうから（${links.map(l => l.no).reverse().join('→')}）</p>
<ol class="res">${[...links].reverse().map(l => `<li data-no="${l.no}"><b>${l.no}</b>${WHO_T(l.p)}の「${esc(CARD_POOL[l.code].name)}」</li>`).join('')}</ol>
<p class="hint">DEMOなので、盤面のカードは動きません</p>`;
  ackLayer.hidden = false;
  // 神の宣告は、すぐ前のチェーンの発動を無効にする（無効にされた神の宣告は、何もしない）
  const negated = new Set();
  for (const l of [...links].reverse()) if (l.code === C.judge && !negated.has(l.no) && l.no > 1) negated.add(l.no - 1);
  for (const l of [...links].reverse()) {
    const li = ackPanel.querySelector(`li[data-no="${l.no}"]`); li.classList.add('now');
    const n = CARD_POOL[l.code].name, neg = negated.has(l.no);
    ackLogLit(ackLogAdd(`チェーン${l.no}：${n}の効果を処理${neg ? '（発動は無効）' : ''}`, `チェーン${l.no}：${n}の効果を処理${neg ? '（発動は無効）' : ''}`));
    await sleep(1300); li.classList.remove('now'); li.classList.add('done');
  }
  await sleep(500); ackLayer.hidden = true;
}
async function runAck(a) {
  const mine = document.getElementById('ackMine').checked, mode = document.querySelector('input[name="ackMode"]:checked')?.value || 'all';
  // 盤面：相手は発動したカード（表）と、伏せた神の宣告。自分は伏せた神の宣告（チェックがある時）
  const s = sceneState({ tp: a.tp, set: { 0: mine ? [C.judge] : [], 1: [a.card, C.judge] }, mons: a.mons, gy: a.gy });
  const up = s.players[1].szone[0]; Object.assign(s.cards[up], { faceUp: true });
  window.__duel.load(s); ackLogEl.innerHTML = '';
  await sleep(350);
  let my = mine; // 自分の神の宣告を、まだ使っていない
  const links = [];
  const act = async (p, code, tgt, targets, arrow) => {
    const link = { p, code, no: links.length + 1, tgt, targets, arrow }; links.push(link);
    const n = CARD_POOL[code].name;
    const row = ackLogAdd(`P${p + 1}：${n}を発動（チェーン${link.no}）`, `${WHO_T(p)}：${n}を発動（チェーン${link.no}）`);
    if (p === 0) { const S = window.__duel.state, u = S.players[0].szone[0]; if (u != null) { S.cards[u].faceUp = true; window.__duel.load(S); } ackLogLit(row); return 'ok'; } // 自分の発動は確かめない
    const canChain = my;
    if (mode === 'none' || (mode === 'chain' && !canChain)) { ackLogLit(row); await ackToastShow(`${WHO_T(p)}が「${n}」を発動（チェーン${link.no}）`); return 'ok'; }
    const v = await ackAsk(link, canChain); ackLogLit(row); return v;
  };
  let v = await act(1, a.card, a.tgt, a.targets, a.arrow);
  if (v === 'chain') {
    my = false;
    await act(0, C.judge, '', [], false);
    await sleep(500);
    // 相手が、自分の神の宣告にさらに神の宣告を重ねる（チェーン3）
    const S = window.__duel.state, u = S.players[1].szone[1]; if (u != null) { S.cards[u].faceUp = true; window.__duel.load(S); }
    await act(1, C.judge, 'あなたの「神の宣告」（チェーン2）の発動を無効にして破壊する', ['0:st:0'], true);
  }
  if (mode === 'none' && links.length === 1) { const n = CARD_POOL[a.card].name; ackLogLit(ackLogAdd(`チェーン1：${n}の効果を処理`, `チェーン1：${n}の効果を処理`)); await sleep(600); return; } // 止めない時は、処理の箱も出さない
  await ackResolve(links);
}
sheet.addEventListener('click', e => { if (e.target.closest('button.fx') && !e.target.closest('button[data-ack]')) ackLogEl.hidden = true; }, true);
list.addEventListener('click', async e => {
  const b = e.target.closest('button[data-ack]'); if (!b || busy) return;
  e.stopImmediatePropagation();
  unlock(); setAllies(false); setOpen(false); openBtn.hidden = true; busy = true;
  try { await runAck(ACKS[b.dataset.ack]); } catch (err) { console.error(err); ackLayer.hidden = true; }
  busy = false; setOpen(true);
}, true);
document.getElementById('guideOpenDemo').onclick =() => { setOpen(false); window.__duel.openGuide(0); const g = root.querySelector('#guideDlg'); const back = new MutationObserver(() => { if (g.hidden) { back.disconnect(); setOpen(true); } }); back.observe(g, { attributes: true, attributeFilter: ['hidden'] }); };
// ?guide を付けて開いた時は、はじめから操作ガイドを開く
if (new URLSearchParams(location.search).has('guide')) setTimeout(() => document.getElementById('guideOpenDemo').click(), 300); else setOpen(true);
