<style>

  --d-shadow: 0 10px 30px rgba(10, 30, 20, .18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;

  --d-shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
} }

  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;

body { margin: 0; background: var(--d-bg); color: var(--d-ink); font-family: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif }

.pv-band b { font-family: Fredoka, "M PLUS Rounded 1c", sans-serif; font-weight: 600 }

/* ---------- t30：相手の発動の確認画面（DEMOだけ。本物の卓にはまだ入れない） ---------- */
#demo .ack-set { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 6px }
#demo .ack-set label { margin-top: 0 }
#demo h3.ack-h { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 13px; margin: 10px 0 4px; color: var(--d-sub) }
#ackLayer { position: fixed; inset: 0; z-index: 58; background: rgba(8, 14, 28, .38) }

#ackArrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
#ackArrows .ring { fill: none; stroke: var(--d-accent); stroke-width: 3; rx: 8; animation: ackPulse 1s ease-in-out infinite alternate }

/* CODE 22:10（MASTERの決定）：［了承］はなし。［チェーンする］以外のどこをタップしても了承。［チェーンする］は大きめで、右上に離して置く */
#ackPanel .chainBtn { margin-left: auto; min-width: 128px; min-height: 56px; border-radius: 12px; font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; padding: 6px 12px; border: 2px solid var(--d-me); background: var(--d-panel); color: var(--d-me); box-shadow: 3px 3px 0 var(--d-me) }

#ackPanel .who .tag, #ackPanel .who .chain, #ackPanel .chainBtn small { white-space: nowrap }

#ackPanel.full { inset: 0; top: 0; right: 0; bottom: 0; left: 0; width: auto; max-width: none; max-height: none; margin: 0; transform: none; border: 0; border-radius: 0; box-shadow: none; overflow: hidden;
  display: grid; grid-template-rows: 1fr 1fr; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) }
#ackPanel.full .artArea { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, var(--d-panel) 0%, var(--d-panel-2) 75%) }

#ackPanel.full h3 { font-size: 22px }
#ackPanel.full .kind { font-size: 13px }
#ackPanel.full .eff { font-size: 15px; line-height: 1.65; max-height: none; overflow: visible }
#ackPanel.full .tgt { font-size: 14px }
#ackPanel.full .hint { margin: 8px 0 0 }
#ackPanel.full .chainBtn { margin: 8px 0 0; width: 100%; min-height: 60px; font-size: 18px }
/* 先輩 11/23 08:56：確認画面のカードを「カード風に大きく」。種類ごとの枠の色・大きな名前・属性とレベルの星／種類・大きな印・文の枠・攻撃力と守備力。
   大きさは --u（カードの幅の1%）で決めるので、縦でも横でも同じ形のまま縮む。外の画像は使わない */
#ackPanel .bc { --u: 2.4px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 4.2);
  border-radius: calc(var(--u) * 4.5); border: calc(var(--u) * 1.1) solid #24150b; background: linear-gradient(160deg, var(--bc1), var(--bc2)); color: #1b1b1b; overflow: hidden;

#ackPanel .bc::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.04) 0 calc(var(--u) * 1), transparent calc(var(--u) * 1) calc(var(--u) * 3)); pointer-events: none }

#ackPanel .bc.f-spell { --bc1: #3cc0a2; --bc2: #127a64; --bcBox: #e3f3ec; --bcMark: #14f0bd }

#ackPanel .bc-top { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); background: rgba(255,255,255,.55); border: calc(var(--u) * .5) solid rgba(0,0,0,.35); border-radius: calc(var(--u) * 1.6) }
#ackPanel .bc-name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1b1b }
#ackPanel .bc-attr { flex: none; width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: calc(var(--u) * 5.4); border: calc(var(--u) * .5) solid rgba(0,0,0,.4) }

#ackPanel .bc-sub i { width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffc27a, #d0451c); border: calc(var(--u) * .3) solid rgba(0,0,0,.3); flex: none }
#ackPanel .bc-art { position: relative; flex: none; align-self: center; width: calc(var(--u) * 82); height: calc(var(--u) * 66); display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3e4560, #161a27 75%); border: calc(var(--u) * .8) solid rgba(0,0,0,.6); box-shadow: inset 0 0 0 calc(var(--u) * .6) rgba(255,255,255,.3) }

<script type="module">
import { mountDuel } from './embed.js?v=20261123-1239-0835efb5cf';
import { playSummon, cardImg, ATTR, RACE_CHAR, SPELL_MARK, TRAP_MARK, FRAME_NAME } from './fx.js?v=20261123-1239-0835efb5cf';
import { play, unlock } from './sound.js?v=20261123-1239-0835efb5cf';
import { CARD_POOL } from './data/cardpool.js?v=20261123-1239-0835efb5cf';
import { createGame, legalActions } from './engine/game.js?v=20261123-1239-0835efb5cf';
import { answerCandidates } from './ai/cpu.js?v=20261123-1239-0835efb5cf';

const host = document.getElementById('duel-host');
// 名札の帯：試作版（/preview/）の時だけ出す。版の名前は version.json（作る時に書く）から読む
if (location.pathname.indexOf('/preview/') >= 0) {
  document.getElementById('pv-band').hidden = false;
  fetch('./version.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(v => { if (v && v.ver) document.getElementById('pv-ver').textContent = `版${String(v.ver).slice(-4)}`; }).catch(() => {});

  // モンスター効果の3つは、相手の伏せカードにサイクロンも置く：だれも重ねられないと、エンジンが発動と同時に効果まで処理してしまい、確認画面が効果のあとになるため
];
/** 光らせるマス：対象をとる時はその対象。とらない時は、効果を受けるモンスター（奈落・ミラーフォースは自分のモンスター、ブラック・ホールは全部） */
const ackKeyOf = (S, u) => { const c = S.cards[u]; if (!c) return null; if (c.zone === 'mzone') return `${c.controller}:mz:${c.index}`; if (c.zone === 'szone') return `${c.controller}:st:${c.index}`; if (c.zone === 'gy') return `pile:${c.owner}:gy`; return null; };
function ackKeys(S, L, code) {
  const key = u => ackKeyOf(S, u);
  if (L.targets && L.targets.length) return L.targets.map(key).filter(Boolean);
  if (code === C.judge) { const prev = S.chain[S.chain.length - 2]; return prev ? [key(prev.uid)].filter(Boolean) : []; }
  const mons = p => S.players[p].mzone.filter(u => u != null && S.cards[u].faceUp && (code !== C.mirror || S.cards[u].position === 'atk'));
  return (code === C.hole ? [...mons(0), ...mons(1)] : mons(0)).map(key).filter(Boolean);

/** 本物の卓のログで、そのチェーンの発動の行を光らせる */
function ackLitReal(no) {
  const li = [...root.querySelectorAll('#log li')].reverse().find(l => l.textContent.includes(`（チェーン${no}）`));
  if (li && li.animate) li.animate([{ background: '#f1c95b', color: '#262b3a' }, { background: '#f1c95b', color: '#262b3a', offset: .35 }, { background: 'transparent' }], { duration: 2400, easing: 'ease-out' });
}
async function runAckFx(a, fx) {
  // 卓の「発動するか聞くタイミング」を、流している間だけ「いつも」にする（何もできない人の自動のパスで、チェーン3が確認画面より先に処理されないように）。終わったら元に戻す
  const cm = root.querySelector('#chainMode'), cm0 = cm ? cm.value : null;
  if (cm) cm.value = 'always';
  // 流している間は、卓のふだんの「〇〇を発動／発動しない」の帯を隠す（聞き方が2つ続けて出ないように。CODE 07:40）
  const hide = document.createElement('style'); hide.id = 'ackHideDock'; hide.textContent = '#dock { visibility: hidden !important }'; root.appendChild(hide);
  try { await ackFxFlow(a, fx); } finally { if (cm) cm.value = cm0; hide.remove(); }
}
/** 演出が終わるのを待つ（ふだんは最長1.2秒。卓の「演出中」の印が残ったままになる場面があるので、待ちすぎない） */
const ackIdle = async (n = 10) => { let calm = 0; for (let i = 0; i < n && calm < 3; i++) { await new Promise(r => setTimeout(r, 120)); calm = root.querySelector('.droot.fx-busy') ? 0 : calm + 1; } };
async function ackFxFlow(a, fx) {
  // 足した場面（fxOnly）では、自分の伏せた神の宣告は置かない（対象を選ぶ途中で重ねると、卓の演出が止まることがあるため。チェーンは罠の場面で試せる）
  const D = window.__duel, mine = document.getElementById('ackMine').checked && !a.fxOnly, mode = document.querySelector('input[name="ackMode"]:checked')?.value || 'all';
  D.load(sceneState({ tp: a.tp, hand: fx.hand, set: { 0: [...(mine ? [C.judge] : []), ...(fx.set0 || [])], 1: fx.set1 }, setMons: fx.setMons1 ? { 1: fx.setMons1 } : undefined, mons: a.mons, gy: a.gy }));
  ackLogEl.hidden = true;
  const steps = [...fx.pre, ...(fx.auto ? [] : [(x, S) => x.type === 'activate' && S.cards[x.card].code === a.card && S.cards[x.card].controller === 1])]; // auto：必ず発動する効果（エンジンが自分で積む）
  const judgeOf = (L, S, p) => L.find(x => x.type === 'activate' && S.cards[x.card].code === C.judge && S.cards[x.card].controller === p);
  let k = 0, seen = 0, plan = '', flash = [], logAt = D.state.log.length, myLeft = mine, firstPick = null;
  for (let guard = 0; guard < 90; guard++) {
    // 発動・効果の演出が終わるまで待つ。ただし、選ぶ欄が出ている間（対象を選ぶなど）は卓が演出中の印を出したままなので、待たずに先に答える
    if (D.state && D.state.pending) await new Promise(r => setTimeout(r, 300)); else await ackIdle();
    let S = D.state; if (!S || S.winner !== null) break;
    // 新しい「〇〇を発動（チェーンN）」のログの行を見て、確認画面を出す。対象を選ぶ前でも出す
    // （だれも重ねられない時、エンジンは対象を選んだのと同じ一手でチェーンを処理まで進めるので、チェーンが増えるのを待つと間に合わない）
    const fresh = S.log.slice(logAt); logAt = S.log.length;
    for (const ln of fresh) {
      const m = /^P([12])：「(.+?)」(?:の効果)?を発動（チェーン(\d+)）/.exec(ln.text); if (!m) continue;
      const p = Number(m[1]) - 1, no = Number(m[3]), code = CODE_OF[m[2]] || a.card; seen = Math.max(seen, no);
      if (p !== 1) { ackLitReal(no); continue; }
      const L = S.chain[no - 1] && S.cards[S.chain[no - 1].uid].code === code ? S.chain[no - 1] : null;
      // 重ねられるか：選ぶ欄が出ている間は、伏せた神の宣告が残っていて、魔法・罠の発動の時だけ（神の宣告はモンスターの効果は無効にできない）
      const canChain = S.pending ? (myLeft && CARD_POOL[code].kind !== 'monster') : legalActions(S).some(x => x.type === 'activate' && S.cards[x.card]?.controller === 0);
      const keys = L ? ackKeys(S, L, code) : [], tgt = no === 1 ? a.tgt : 'あなたの「神の宣告」（チェーン2）の発動を無効にして破壊する';
      if (no === 1 && L) flash = L.targets && L.targets.length ? L.targets.map(u => [u, ackKeyOf(S, u)]) : keys.map(x => [null, x]); // 対象をとる時は、カードを覚えておく
      let v = 'ok';
      if (mode === 'none' || (mode === 'chain' && !canChain)) { ackLitReal(no); ackToastShow(`相手が「${CARD_POOL[code].name}」を発動（チェーン${no}）`); }
      else { v = await ackAsk({ p: 1, code, no, tgt }, canChain); ackLitReal(no); }
      if (v === 'chain') plan = 'mine';
      if (no > 1 && v === 'ok' && keys.length) await ackFlash(keys); // チェーン3：何を無効にするのかを、盤面で光らせる
    }
    S = D.state;
    // 確認画面の時にまだチェーンに積まれていなかった（対象を選ぶ前だった）時は、積まれたあとで光らせる対象を覚える
    if (!flash.length && S.chain[0] && S.chain[0].player === 1) { const L0 = S.chain[0]; flash = L0.targets && L0.targets.length ? L0.targets.map(u => [u, ackKeyOf(S, u)]) : ackKeys(S, L0, S.cards[L0.uid].code).map(x => [null, x]); }
    if (k >= steps.length && seen && !S.chain.length && !S.pending) break; // チェーンが全部処理された
    const L = legalActions(S);
    let act = k < steps.length ? L.find(x => steps[k](x, S)) : null;
    if (act) k++;
    else if (plan === 'mine' && (act = judgeOf(L, S, 0))) { plan = 'opp'; myLeft = false; }      // 自分の神の宣告（チェーン2）
    else if (plan === 'opp' && (act = judgeOf(L, S, 1))) plan = 'done';     // 相手がさらに神の宣告（チェーン3）
    else if (S.pending) { const c = answerCandidates(S, S.pending.request, 4), mineOf = v => { const u = Array.isArray(v) ? v[0] : v; return typeof u === 'number' && S.cards[u] && S.cards[u].controller === 0; }; const v = S.pending.request.player === 1 ? (c.find(mineOf) ?? c[0]) : c[0]; act = c.length ? { type: 'answer', value: v } : null; if (act && S.pending.request.player === 1 && !firstPick) firstPick = [].concat(v).filter(u => typeof u === 'number' && S.cards[u]).map(u => [u, ackKeyOf(S, u)]); } // 相手が最初に選んだもの（対象）を覚えておく
    else if (S.window && S.window.respondDue && !S.chain.length) act = { type: 'offer' };
    else act = L.find(x => x.type === 'offer') || L.find(x => x.type === 'pass');
    if (!act) break;
    try { D.act(act); } catch (err) { console.warn('確認画面の場面を進められませんでした', act, err); break; }
    await new Promise(r => setTimeout(r, 350));
  }
  await ackIdle(50); // 効果の演出（最長6秒）
  if (!flash.length && firstPick) flash = firstPick; // チェーンがすぐ処理された時は、相手が選んだ対象を光らせる
  // 対象のカードが動いた時（死者蘇生で相手の場へ、など）は、いまの場所を光らせる。場から離れた時（除外など）は、元のマス
  await ackFlash(flash.map(([u, x]) => (u != null && ackKeyOf(D.state, u)) || x)); // 効果の演出のあと、対象（効果を受けたマス）が黄色く光る
}
sheet.addEventListener('click', e => { if (e.target.closest('button.fx') && !e.target.closest('button[data-ack]')) ackLogEl.hidden = true; }, true);
list.addEventListener('click', async e => {
  const b = e.target.closest('button[data-ack]'); if (!b || busy) return;
  e.stopImmediatePropagation();

  try { if (document.getElementById('ackFx').checked || ACKS[b.dataset.ack].fxOnly) await runAckFx(ACKS[b.dataset.ack], ACK_FX[b.dataset.ack]); else await runAck(ACKS[b.dataset.ack]); } catch (err) { console.error(err); ackLayer.hidden = true; }
  busy = false; setOpen(true);
}, true);
