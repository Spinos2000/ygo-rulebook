<!doctype html>
<meta charset="utf-8">
<title>演出DEMO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* 演出だけを確かめるページ（遊ぶ人の画面からは入れない。リンクを知っている人だけ）。盤面は本物のデュエル卓を静かに開いて使う */
:root {
  --d-bg: #f5f2eb; --d-panel: #fffdf8; --d-panel-2: #f3eee4; --d-ink: #262b3a; --d-sub: #6a6e7e; --d-line: #e2dbcd; --d-edge: #2c3244;
  --d-mat: #1d4737; --d-mat-2: #163a2c; --d-mat-line: #5c8c78; --d-mat-ink: #d6ece1;
  --d-accent: #f1c95b; --d-accent-ink: #262b3a; --d-opp: #d75a5f; --d-me: #3e6fd0; --d-bad: #b23a3a;
  --d-shadow: 0 10px 30px rgba(10, 30, 20, .18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;
  --d-mat: #173d2f; --d-mat-2: #102c21; --d-mat-line: #3f6e5c; --d-mat-ink: #cfe6da; --d-accent: #f0d27a; --d-opp: #e07479; --d-me: #6b97dd; --d-bad: #e07070;
  --d-shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --d-bg: #141d33; --d-panel: #1c2742; --d-panel-2: #24314f; --d-ink: #e9ecf4; --d-sub: #a9b2c8; --d-line: #34426a; --d-edge: #0f1628;
  --d-mat: #173d2f; --d-mat-2: #102c21; --d-mat-line: #3f6e5c; --d-mat-ink: #cfe6da; --d-accent: #f0d27a; --d-opp: #e07479; --d-me: #6b97dd; --d-bad: #e07070;
  --d-shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
body { margin: 0; background: var(--d-bg); color: var(--d-ink); font-family: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif }
/* 演出を選ぶ欄：右下の丸いボタンで開く。開いている間は盤面の上に出て、押すと閉じてすぐ演出が始まる */
#demoOpen { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; border: 2px solid var(--d-edge); border-radius: 999px;
  background: var(--d-accent); color: var(--d-accent-ink); font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; padding: 14px 18px; box-shadow: var(--d-shadow); cursor: pointer }
#demo { position: fixed; inset: auto 0 0 0; z-index: 61; max-height: 78vh; overflow-y: auto; background: var(--d-panel); color: var(--d-ink);
  border-top: 2px solid var(--d-edge); border-radius: 18px 18px 0 0; box-shadow: var(--d-shadow); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)) }
#demo[hidden] { display: none }
#demo header { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -12px; background: var(--d-panel); padding: 4px 0 8px }
#demo h1 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0 }
#demo .close { border: 1px solid var(--d-line); background: var(--d-panel-2); color: var(--d-ink); border-radius: 10px; font-family: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer }
#demo .note { font-size: 12px; color: var(--d-sub); margin: 0 0 6px }
#demo h2 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 14px; line-height: 1.4; margin: 14px 0 6px }
#demo h2 small { font-weight: 500; color: var(--d-sub) }
#demo .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
#demo button.fx { min-height: 48px; text-align: left; border: 1px solid var(--d-line); border-radius: 12px; background: var(--d-panel-2); color: var(--d-ink);
  font-family: inherit; font-weight: 700; font-size: 13px; line-height: 1.35; padding: 8px 10px; cursor: pointer }
#demo button.fx small { display: block; font-weight: 500; font-size: 11px; color: var(--d-sub) }
#demo button.fx:active { transform: translateY(1px) }
#demo label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 6px }
#demo .guide-open { width: 100%; margin-top: 10px }
#demo details.dev { margin-top: 18px; border-top: 1px solid var(--d-line); padding-top: 8px }
#demo details.dev summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--d-sub); min-height: 32px }
/* 名札の帯（先輩 11/23 08:56）：試作版（/preview/）で開いた時だけ、いちばん上に細く出す */
.pv-band { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 12px; padding: 5px 12px; background: #fde9a8; color: #3a2f12; border-bottom: 1.5px solid #c9a646; font: 700 13px/1.4 "Zen Maru Gothic", "M PLUS Rounded 1c", sans-serif }
.pv-band[hidden] { display: none }
.pv-band b { font-family: Fredoka, "M PLUS Rounded 1c", sans-serif; font-weight: 600 }
.pv-band a { color: #3a2f12; background: #fff7dc; border: 1.5px solid #c9a646; border-radius: 999px; padding: 2px 10px; text-decoration: none; white-space: nowrap }
/* ---------- t30：相手の発動の確認画面（DEMOだけ。本物の卓にはまだ入れない） ---------- */
#demo .ack-set { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 6px }
#demo .ack-set label { margin-top: 0 }
#demo h3.ack-h { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 13px; margin: 10px 0 4px; color: var(--d-sub) }
#ackLayer { position: fixed; inset: 0; z-index: 58; background: rgba(8, 14, 28, .38) }
#ackLayer[hidden], #ackToast[hidden] { display: none }
#ackArrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
#ackArrows .ring { fill: none; stroke: var(--d-accent); stroke-width: 3; rx: 8; animation: ackPulse 1s ease-in-out infinite alternate }
#ackArrows .line { fill: none; stroke: var(--d-accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 7; animation: ackDash .8s linear infinite }
#ackArrows .head { fill: var(--d-accent) }
@keyframes ackPulse { from { opacity: .55 } to { opacity: 1 } }
@keyframes ackDash { to { stroke-dashoffset: -17 } }
#ackPanel { position: absolute; left: 12px; right: 12px; max-width: 560px; margin: 0 auto; max-height: calc(100% - 24px); overflow-y: auto; background: var(--d-panel); color: var(--d-ink);
  border: 2.5px solid var(--d-edge); border-radius: 16px; box-shadow: 5px 6px 0 var(--d-edge); padding: 12px 14px 14px; box-sizing: border-box }
#ackPanel.at-top { top: calc(12px + env(safe-area-inset-top, 0px)) }
#ackPanel.at-bottom { bottom: calc(12px + env(safe-area-inset-bottom, 0px)) }
#ackPanel .who { display: flex; align-items: center; gap: 8px; font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 14px; margin: 0 0 8px }
#ackPanel .who .tag { background: var(--d-opp); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 13px }
#ackPanel .who .tag.me { background: var(--d-me) }
#ackPanel .who .chain { border: 1.5px solid var(--d-edge); border-radius: 999px; padding: 2px 10px; background: var(--d-accent); color: var(--d-accent-ink); font-family: Fredoka, inherit; font-size: 13px }
#ackPanel .body { display: flex; gap: 12px; align-items: flex-start }
#ackPanel .art { flex: none; width: 100px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0, 0, 0, .25) }
#ackPanel .txt { min-width: 0; flex: 1 }
#ackPanel h3 { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 19px; line-height: 1.3; margin: 0 0 2px }
#ackPanel .kind { font-size: 12px; color: var(--d-sub); margin: 0 0 6px }
#ackPanel .eff { font-size: 13.5px; line-height: 1.55; margin: 0; padding: 8px 10px; background: var(--d-panel-2); border: 1px solid var(--d-line); border-radius: 10px; max-height: 9.6em; overflow-y: auto; white-space: pre-wrap }
#ackPanel .tgt { font-size: 13px; font-weight: 700; margin: 8px 0 0 }
#ackPanel .tgt::before { content: "🎯 " }
/* CODE 22:10（MASTERの決定）：［了承］はなし。［チェーンする］以外のどこをタップしても了承。［チェーンする］は大きめで、右上に離して置く */
#ackPanel .chainBtn { margin-left: auto; min-width: 128px; min-height: 56px; border-radius: 12px; font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; padding: 6px 12px; border: 2px solid var(--d-me); background: var(--d-panel); color: var(--d-me); box-shadow: 3px 3px 0 var(--d-me) }
#ackPanel .chainBtn small { display: block; font-family: "M PLUS Rounded 1c", inherit; font-weight: 500; font-size: 11px }
#ackPanel .chainBtn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--d-me) }
#ackLayer { cursor: pointer }
#ackPanel .who .tag, #ackPanel .who .chain, #ackPanel .chainBtn small { white-space: nowrap }
#ackPanel .chainBtn:disabled { border-color: var(--d-line); background: var(--d-panel-2); color: var(--d-sub); box-shadow: none; opacity: .75; cursor: not-allowed }
#ackPanel .hint { font-size: 12px; color: var(--d-sub); margin: 10px 0 0; text-align: center; opacity: .35; transition: opacity .2s }
#ackPanel.ready .hint { opacity: 1 }
/* CODE 23:17（先輩の注文）：確認画面は画面いっぱい。縦は上半分にカードの絵・下半分に文、横は左半分に絵・右半分に文。矢印はやめて、了承のあと盤面で対象を一瞬光らせる */
#ackPanel.full { inset: 0; top: 0; right: 0; bottom: 0; left: 0; width: auto; max-width: none; max-height: none; margin: 0; transform: none; border: 0; border-radius: 0; box-shadow: none; overflow: hidden;
  display: grid; grid-template-rows: 1fr 1fr; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px) }
#ackPanel.full .artArea { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, var(--d-panel) 0%, var(--d-panel-2) 75%) }
#ackPanel.full .who { position: absolute; top: 10px; left: 12px; right: 12px; margin: 0; z-index: 1 }
#ackPanel.full .art { border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .3) }
#ackPanel.full .info { min-height: 0; display: flex; flex-direction: column; padding: 14px 16px 14px; border-top: 2.5px solid var(--d-edge) }
#ackPanel.full .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain }
#ackPanel.full h3 { font-size: 22px }
#ackPanel.full .kind { font-size: 13px }
#ackPanel.full .eff { font-size: 15px; line-height: 1.65; max-height: none; overflow: visible }
#ackPanel.full .tgt { font-size: 14px }
#ackPanel.full .hint { margin: 8px 0 0 }
#ackPanel.full .chainBtn { margin: 8px 0 0; width: 100%; min-height: 60px; font-size: 18px }
/* 先輩 11/23 08:56：確認画面のカードを「カード風に大きく」。種類ごとの枠の色・大きな名前・属性とレベルの星／種類・大きな印・文の枠・攻撃力と守備力。
   大きさは --u（カードの幅の1%）で決めるので、縦でも横でも同じ形のまま縮む。外の画像は使わない */
#ackPanel .bc { --u: 2.4px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); padding: calc(var(--u) * 4.2);
  border-radius: calc(var(--u) * 4.5); border: calc(var(--u) * 1.1) solid #24150b; background: linear-gradient(160deg, var(--bc1), var(--bc2)); color: #1b1b1b; overflow: hidden;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .3); font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", sans-serif; line-height: 1.2 }
#ackPanel .bc::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.04) 0 calc(var(--u) * 1), transparent calc(var(--u) * 1) calc(var(--u) * 3)); pointer-events: none }
#ackPanel .bc.f-normal { --bc1: #ecc97c; --bc2: #c99d4c; --bcBox: #f6ead0; --bcMark: #ffd36b }
#ackPanel .bc.f-effect { --bc1: #e29a5e; --bc2: #b4652e; --bcBox: #f4e3cd; --bcMark: #ffab5e }
#ackPanel .bc.f-fusion { --bc1: #b597de; --bc2: #7a5aac; --bcBox: #eee7f6; --bcMark: #d3a8ff }
#ackPanel .bc.f-ritual { --bc1: #94c0ee; --bc2: #4f86c6; --bcBox: #e6eef8; --bcMark: #8fd0ff }
#ackPanel .bc.f-spell { --bc1: #3cc0a2; --bc2: #127a64; --bcBox: #e3f3ec; --bcMark: #14f0bd }
#ackPanel .bc.f-trap { --bc1: #d071a1; --bc2: #963f6c; --bcBox: #f6e4ec; --bcMark: #ff5fb8 }
#ackPanel .bc-top { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); background: rgba(255,255,255,.55); border: calc(var(--u) * .5) solid rgba(0,0,0,.35); border-radius: calc(var(--u) * 1.6) }
#ackPanel .bc-name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1b1b }
#ackPanel .bc-attr { flex: none; width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: calc(var(--u) * 5.4); border: calc(var(--u) * .5) solid rgba(0,0,0,.4) }
#ackPanel .bc-sub { position: relative; min-height: calc(var(--u) * 6); display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--u) * .6); font-weight: 700; font-size: calc(var(--u) * 5); color: #1b1b1b }
#ackPanel .bc-sub i { width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffc27a, #d0451c); border: calc(var(--u) * .3) solid rgba(0,0,0,.3); flex: none }
#ackPanel .bc-art { position: relative; flex: none; align-self: center; width: calc(var(--u) * 82); height: calc(var(--u) * 66); display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3e4560, #161a27 75%); border: calc(var(--u) * .8) solid rgba(0,0,0,.6); box-shadow: inset 0 0 0 calc(var(--u) * .6) rgba(255,255,255,.3) }
#ackPanel .bc-art span { font-size: calc(var(--u) * 40); line-height: 1; color: var(--bcMark); text-shadow: 0 0 calc(var(--u) * 5) var(--bcMark), 0 0 calc(var(--u) * 12) var(--bcMark); font-family: "Zen Maru Gothic", sans-serif; font-weight: 700 }
#ackPanel .bc-box { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: calc(var(--u) * 2) calc(var(--u) * 2.6); background: var(--bcBox); border: calc(var(--u) * .5) solid rgba(0,0,0,.4); border-radius: calc(var(--u) * 1) }
#ackPanel .bc-type { margin: 0 0 calc(var(--u) * 1); font-weight: 700; font-size: calc(var(--u) * 4.4) }
#ackPanel .bc-text { flex: 1; min-height: 0; margin: 0; overflow: hidden; font-family: "M PLUS Rounded 1c", sans-serif; font-size: calc(var(--u) * 4.1); line-height: 1.35; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent) }
#ackPanel .bc-stat { margin: calc(var(--u) * 1) 0 0; padding-top: calc(var(--u) * .8); border-top: calc(var(--u) * .4) solid rgba(0,0,0,.55); text-align: right; font-family: Fredoka, sans-serif; font-weight: 600; font-size: calc(var(--u) * 5.2) }
#ackFlash { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 57; pointer-events: none; overflow: visible }
#ackFlash .ring { fill: rgba(241, 201, 91, .28); stroke: var(--d-accent); stroke-width: 4; animation: ackBlink .32s ease-in-out 4 alternate }
@keyframes ackBlink { from { opacity: .2 } to { opacity: 1 } }
/* 止めない時：上に小さく出して、すぐ消える */
/* t53（先輩 11/24）：カットイン。相手の発動の演出のあと、確認画面の前に、性格ごとの掛け声とセリフを画面の真ん中の帯で出す。無効にされた時は「なにっ！？」 */
#ackCut { position: fixed; inset: 0; z-index: 59; display: grid; place-items: center; pointer-events: none; overflow: hidden }
#ackCut[hidden] { display: none }
#ackCut .band { width: 100%; box-sizing: border-box; padding: 14px 16px 16px; background: linear-gradient(100deg, rgba(20, 24, 40, .94), rgba(44, 50, 82, .94)); border-top: 3px solid var(--d-opp); border-bottom: 3px solid var(--d-opp);
  color: #fff; transform: skewY(-4deg); animation: ackCutIn .28s cubic-bezier(.2, .9, .3, 1.1) both }
#ackCut .band.stay { animation: none }
#ackCut.out .band { animation: ackCutOut .22s ease-in both }
#ackCut .in { transform: skewY(4deg); max-width: 640px; margin: 0 auto; display: grid; gap: 6px; text-align: center; min-width: 0 }
/* 先輩 11/24 16:28：文字はすべて真ん中そろえ。セリフ帳の改行の所だけで改行し、ほかでは折り返さない（入りきらない時は ackFitCut で文字を小さくする） */
#ackCut .in > p { margin: 0; min-width: 0; white-space: pre; word-break: keep-all; overflow-wrap: normal; overflow: hidden }
#ackCut .who { font-size: 12px; font-weight: 700; opacity: .85; letter-spacing: .04em }
#ackCut .who b { background: var(--d-opp); color: #fff; border-radius: 999px; padding: 2px 10px; margin-right: 6px }
#ackCut .call { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: clamp(22px, 7vw, 34px); line-height: 1.2; color: var(--d-accent); text-shadow: 0 2px 0 rgba(0, 0, 0, .5) }
#ackCut .line { font-family: "Zen Maru Gothic", inherit; font-weight: 700; font-size: clamp(17px, 5vw, 24px); line-height: 1.45 }
#ackCut .card { font-size: 12px; opacity: .8 }
#ackCut.neg .band { border-color: var(--d-bad); background: linear-gradient(100deg, rgba(60, 14, 20, .95), rgba(96, 26, 34, .95)) }
#ackCut.neg .call { color: #fff; font-size: clamp(30px, 10vw, 48px) }
@keyframes ackCutIn { from { transform: translateX(110%) skewY(-4deg) } to { transform: translateX(0) skewY(-4deg) } }
@keyframes ackCutOut { to { transform: translateX(-110%) skewY(-4deg); opacity: .4 } }
#demo .ack-persona { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px }
#demo .ack-persona button { border: 1px solid var(--d-line); background: var(--d-panel-2); color: var(--d-ink); border-radius: 999px; padding: 6px 12px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; min-height: 36px }
#demo .ack-persona button[aria-pressed="true"] { border: 2px solid var(--d-edge); background: var(--d-accent); color: var(--d-accent-ink) }
/* 先輩 11/23 18:02：相手がチェーンを重ねる前の「間」の札 */
#ackThink { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 59; background: var(--d-panel); color: var(--d-ink); border: 1.5px solid var(--d-edge); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; box-shadow: 2px 3px 0 var(--d-edge); animation: ackThinkBlink 1s ease-in-out infinite alternate }
#ackThink[hidden] { display: none }
@keyframes ackThinkBlink { from { opacity: .65 } to { opacity: 1 } }
#ackToast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 58; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--d-panel); color: var(--d-ink); border: 2px solid var(--d-edge); border-radius: 12px; box-shadow: 3px 4px 0 var(--d-edge); padding: 8px 14px; font-weight: 700; font-size: 14px }
  background: var(--d-panel); color: var(--d-ink); border: 1.5px solid var(--d-edge); border-radius: 12px; font-size: 12px; box-shadow: var(--d-shadow) }
/* 横向き（スマホの横・パソコン）：確認の箱は、対象と反対の横に寄せる */
@media (orientation: landscape) and (min-width: 640px) {
  #ackPanel { left: auto; right: auto; width: min(440px, 46vw); margin: 0; top: 50%; bottom: auto; transform: translateY(-50%) }
  #ackPanel.at-left { left: calc(12px + env(safe-area-inset-left, 0px)) }
  #ackPanel.at-right { right: calc(12px + env(safe-area-inset-right, 0px)) }
}
@media (orientation: landscape) and (min-width: 640px) {
  #ackPanel.full { grid-template-rows: none; grid-template-columns: 1fr 1fr }
  #ackPanel.full .info { border-top: 0; border-left: 2.5px solid var(--d-edge) }
}

  { hand: { 0: [C.c] }, set1: ['4909', C.judge, C.judge], set0: [C.torrent], pre: [a => a.type === 'normalSummon'] },
  // 早すぎた埋葬：相手のターンに、手札から発動。相手の墓地のモンスターが対象
  { hand: { 1: ['4966'] }, set1: [C.judge, C.judge], pre: [] },
  // デビルガイ：相手のメインフェイズに、起動効果を発動。あなたのモンスターが対象（モンスターの効果なので、神の宣告ではチェーンできない＝灰色）
  { set1: [C.judge, C.judge, '4909'], pre: [] },
  // 墓守の番兵：相手が反転召喚 → リバース効果（必ず発動）。発動はエンジンが自分でチェーンに積む

  // 暗黒ブラキ：相手が通常召喚 → 召喚に成功した時の誘発効果
  { hand: { 1: ['10924'] }, set1: [C.judge, C.judge, '4909'], pre: [a => a.type === 'normalSummon'] },
  // ディアボリックガイ：相手のメインフェイズに、墓地から除外して発動（デッキにもう1枚）。相手はサイクロンも伏せる（すぐ処理されないように）

  // モンスター効果の3つは、相手の伏せカードにサイクロンも置く：だれも重ねられないと、エンジンが発動と同時に効果まで処理してしまい、確認画面が効果のあとになるため

/** 光らせるマス：対象をとる時はその対象。とらない時は、効果を受けるモンスター（奈落・ミラーフォースは自分のモンスター、ブラック・ホールは全部） */

const ackSig = (S, u) => { const c = S.cards[u]; return c ? [c.zone, c.index, c.controller, c.position, c.faceUp].join('|') : ''; };

  if (li && li.animate) li.animate([{ background: '#f1c95b', color: '#262b3a' }, { background: '#f1c95b', color: '#262b3a', offset: .35 }, { background: 'transparent' }], { duration: 2400, easing: 'ease-out' });

async function runAckFx(a, fx) {

  const hide = document.createElement('style'); hide.id = 'ackHideDock'; hide.textContent = '#dock { visibility: hidden !important }'; root.appendChild(hide);

/** 演出を待つ長い上限（ミリ秒）。卓の「演出中」の印が残ったままになった時に、止まり続けないため */
const FX_WAIT_MAX = 20000;

const ackIdle = async () => {
  const t0 = performance.now();
  for (let calm = 0; calm < 3;) {
    await new Promise(r => setTimeout(r, 120));
    calm = root.querySelector('.droot.fx-busy') ? 0 : calm + 1;
    if (calm < 3 && performance.now() - t0 > FX_WAIT_MAX) { console.warn('演出が終わらないまま、待つ上限になりました'); return; }
  }
};
async function ackFxFlow(a, fx) {

  D.load(sceneState({ tp: a.tp, hand: fx.hand, set: { 0: [...(mine ? [C.judge] : []), ...(fx.set0 || [])], 1: fx.set1 }, setMons: fx.setMons1 ? { 1: fx.setMons1 } : undefined, deck: fx.deck1 ? { 1: fx.deck1 } : undefined, mons: a.mons, gy: a.gy }));

    // （だれも重ねられない時、エンジンは対象を選んだのと同じ一手でチェーンを処理まで進めるので、チェーンが増えるのを待つと間に合わない）

      const keys = L ? ackUids(S, L, code).map(u => ackKeyOf(S, u)).filter(Boolean) : [], tgt = no === 1 ? a.tgt : 'あなたの「神の宣告」（チェーン2）の発動を無効にして破壊する';

      else { await ackCutin(S, code); v = await ackAsk({ p: 1, code, no, tgt }, canChain); ackLitReal(no); } // t53：発動の演出 → カットイン → 確認画面

    if (!flash.length && S.chain[0] && S.chain[0].player === 1) flash = ackMarkOf(S, S.chain[0], S.cards[S.chain[0].uid].code);

  if (!flash.length && firstPick) flash = firstPick; // チェーンがすぐ処理された時は、相手が選んだ対象を光らせる

  // 無効にされた時など、変わらなかったカードは光らせない。対象をとらない効果は、変わる前のマス
